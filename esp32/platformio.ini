; Intune ESP32 firmware (BLE UART bridge — blink bring-up first)
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^2.3.7
build_flags =
    -D CONFIG_BT_NIMBLE_TASK_STACK_SIZE=4096