[project]
name = "intune-visualizer"
version = "0.2.0"
description = "Real-time pitch visualization and intonation feedback tool for viola (Alto Clef)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
intune-visualizer = "visualizer:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["visualizer"]
